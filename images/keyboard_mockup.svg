<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
    <!-- Background -->
    <rect width="800" height="600" fill="#0f172a" />
    
    <!-- Grid pattern -->
    <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
        </pattern>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="15" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <rect width="800" height="600" fill="url(#grid)" />
    
    <!-- Key background with glow -->
    <rect x="300" y="200" width="200" height="200" rx="30" fill="#1e293b" stroke="#38bdf8" stroke-width="4" filter="url(#glow)" />
    <rect x="300" y="200" width="200" height="200" rx="30" fill="#1e293b" />
    
    <!-- Key character -->
    <text x="400" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="100" font-weight="bold" fill="#e0f2fe" text-anchor="middle">K</text>
    
    <!-- UI Text -->
    <text x="400" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="bold" fill="#94a3b8" text-anchor="middle" letter-spacing="4">KEY PRESS VISUALIZER</text>
    
    <!-- Bottom info -->
    <rect x="250" y="470" width="300" height="50" rx="10" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <text x="400" y="502" font-family="monospace" font-size="18" fill="#38bdf8" text-anchor="middle">event.key="K" | keyCode=75</text>
</svg>
