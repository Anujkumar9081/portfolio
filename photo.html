
<!--     // this files is the lineing effect in the Background 
        // Completed generated by   {A.I}           -->    

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Network Background</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: white;
            overflow: hidden;
        }

        #tsparticles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0; 
        }

        .content {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            pointer-events: none; 
        }

        h1 {
            color: #8a2c2c;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 300;
            letter-spacing: 8px;
            margin: 0;
        }
    </style>
</head>

    <div id="tsparticles"></div>

    <div class="content">
        
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>

    <script>
        tsParticles.load("tsparticles", {
            fpsLimit: 120,
            interactivity: {
                events: {
                    onHover: {
                        enable: true,
                        mode: "grab",
                    },
                    resize: true,
                },
                modes: {
                    grab: {
                        distance: 250, // Increased grab reach
                        links: {
                            opacity: 0.6
                        }
                    }
                },
            },
            particles: {
                color: {
                    value: "#666666",
                },
                links: {
                    enable: true,
                    color: "#555",
                    distance: 200,    // INCREASED: Lines connect to further particles
                    opacity: 0.25,   // Slightly more visible
                    width: 1,
                },
                move: {
                    enable: true,
                    speed: 0.7,
                    direction: "none",
                    outModes: { default: "out" },
                },
                number: {
                    density: {
                        enable: true,
                        area: 800,
                    },
                    value: 120,      // INCREASED: More particles = more line intersections
                },
                opacity: {
                    value: 0.4,
                },
                shape: {
                    type: "circle",
                },
                size: {
                    value: { min: 1, max: 3 },
                },
            },
            detectRetina: true,
        });
    </script>
</body>
</html>
